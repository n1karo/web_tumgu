<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<header>
			<div class="header__nav"></div>
			<section class="header__inner">
				<div class="header__content">
					<div class="header__title"></div>
					<div class="header__info">
						<div class="header__text"></div>
						<form class="header__form"></form>
					</div>
				</div>
			</section>
		</header>

        <main>
            <section class="development">
                <div class="development__inner">
                    <div class="developnemt__content"></div>
                    <nav class="development__nav">
                        <ul class="development__list">
                            <li class="development__item"></li>
                        </ul>
                    </nav>
                </div>
            </section>

            <section class="industries">
                <div class="industries__inner">
                    <div class="industries__title"></div>
                    <ul class="industries__list">
                        <li class="industries__item"></li>
                    </ul>
                </div>
            </section>

            <section class="projects">
                <nav class="projects__nav">
                    <ul class="projects__list">
                        <li class="projects__-item"></li>
                    </ul>
                </nav>

                <article class="projects__card">
                    <div class="projects__content"></div>
                </article>
            </section>

            <section class="discuss">
                <div class="discuss__inner">
                    <div class="discuss__text"></div>
                    <form class="discuss__form"></form>
                </div>
            </section>

            <section class="application">
                <div class="application__list">
                    <article class="application__item"></article>
                </div>
            </section>

            <section class="team">
                <div class="team__content"></div>
            </section>

            <section class="contact">
                <div class="contact__form"></div>
            </section>

            <section class="faq">
                <ul class="faq__list">
                    <li class="faq__item"></li>
                </ul>
            </section>
        </main>

        <footer class="footer">
            <ul class="footer__list">
                <li class="footer__item"></li>
            </ul>
        </footer>
	</body>
</html>
